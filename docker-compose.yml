version: '3.8'

services:
  # MongoDB 服务
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: chat_app
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - chat_network

  # 服务器应用服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chat_server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URL: mongodb://root:example@mongodb:27017/chat_app?authSource=admin
      QWEN_API_KEY: ${QWEN_API_KEY}
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - chat_network

  # 客户端应用服务（可选，用于本地测试）
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chat_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://8.137.53.3:5000
    networks:
      - chat_network

volumes:
  mongo_data:
    driver: local

networks:
  chat_network:
    driver: bridge